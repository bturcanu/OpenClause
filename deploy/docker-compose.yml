services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openclause}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-openclause}
    env_file: ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openclause} -d ${POSTGRES_DB:-openclause}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: postgres:16-alpine
    env_file: ../.env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations:ro
    command:
      - /bin/sh
      - -lc
      - >
        set -eu;
        until pg_isready -h postgres -p 5432 -U ${POSTGRES_USER:-openclause} -d ${POSTGRES_DB:-openclause}; do
          sleep 1;
        done;
        psql -v ON_ERROR_STOP=1 -1 -h postgres -p 5432 -U ${POSTGRES_USER:-openclause} -d ${POSTGRES_DB:-openclause} -f /migrations/001_initial.sql
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${EVIDENCE_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${EVIDENCE_S3_SECRET_KEY:-minioadmin}
    env_file: ../.env
    command: server /data --console-address :9001
    volumes:
      - minio_data:/data
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:0.62.0
    ports:
      - "127.0.0.1:8181:8181"
    command:
      - "run"
      - "--server"
      - "--log-level=info"
      - "/policy"
    volumes:
      - ../policy/bundles/v0:/policy:ro
    healthcheck:
      test: ["CMD", "/opa", "eval", "true"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  approvals:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: approvals
    ports:
      - "8081:8081"
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable
      APPROVALS_ADDR: :8081
      CONNECTOR_SLACK_URL: http://connector-slack:8082
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 2 http://127.0.0.1:8081/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  connector-slack:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: connector-slack
    ports:
      - "8082:8082"
    env_file: ../.env
    environment:
      CONNECTOR_SLACK_ADDR: :8082
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 2 http://127.0.0.1:8082/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  connector-jira:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: connector-jira
    ports:
      - "8083:8083"
    env_file: ../.env
    environment:
      CONNECTOR_JIRA_ADDR: :8083
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 2 http://127.0.0.1:8083/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: gateway
    ports:
      - "8080:8080"
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable
      OPA_URL: http://opa:8181
      APPROVALS_URL: http://approvals:8081
      PUBLIC_APPROVALS_URL: http://localhost:8081
      CONNECTOR_SLACK_URL: http://connector-slack:8082
      CONNECTOR_JIRA_URL: http://connector-jira:8083
      EVIDENCE_S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      opa:
        condition: service_healthy
      approvals:
        condition: service_healthy
      connector-slack:
        condition: service_healthy
      connector-jira:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 2 http://127.0.0.1:8080/readyz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  console-api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: console-api
    ports:
      - "8090:8090"
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable
      CONSOLE_API_ADDR: :8090
      GATEWAY_URL: http://gateway:8080
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-http://localhost:8080}
      CONSOLE_JWT_SECRET: ${CONSOLE_JWT_SECRET:?CONSOLE_JWT_SECRET must be set in .env}
      OPA_URL: http://opa:8181
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      opa:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 2 http://127.0.0.1:8090/readyz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  console-ui:
    build:
      context: ../web/console
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    depends_on:
      - console-api
    restart: unless-stopped

  alert-worker:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: alert-worker
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:?INTERNAL_AUTH_TOKEN must be set}
      CONNECTOR_SLACK_URL: http://connector-slack:8082
      ALERT_WORKER_INTERVAL_SEC: 30
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      connector-slack:
        condition: service_healthy
    restart: unless-stopped

  poststart-smoke:
    image: curlimages/curl:8.8.0
    profiles: ["smoke"]
    env_file: ../.env
    environment:
      GATEWAY_URL: http://gateway:8080
      APPROVALS_URL: http://approvals:8081
      CONNECTOR_SLACK_URL: http://connector-slack:8082
      CONNECTOR_JIRA_URL: http://connector-jira:8083
      CONSOLE_API_URL: http://console-api:8090
      OPA_URL: http://opa:8181
    volumes:
      - ../scripts:/scripts:ro
    depends_on:
      approvals:
        condition: service_healthy
      connector-slack:
        condition: service_healthy
      connector-jira:
        condition: service_healthy
      gateway:
        condition: service_healthy
      console-api:
        condition: service_healthy
      opa:
        condition: service_healthy
    command: ["sh", "/scripts/post-start-smoke.sh"]
    restart: "no"

volumes:
  postgres_data:
  minio_data:
