fullnameOverride: "console-api"

image:
  repository: oc/console-api
  tag: "latest"
  pullPolicy: IfNotPresent

replicas: 1

service:
  port: 8090

# Optional: name of a Kubernetes Secret to load as env vars
# secretRef: console-api-secrets
secretRef: ""

env:
  CONSOLE_API_ADDR: ":8090"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_SSLMODE: disable
  OPA_URL: http://opa:8181

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: console-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
