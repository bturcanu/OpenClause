fullnameOverride: "console-api"

image:
  repository: oc/console-api
  tag: "latest"
  pullPolicy: IfNotPresent

replicas: 1

service:
  port: 8090

# Optional: name of a Kubernetes Secret to load as env vars
# secretRef: console-api-secrets
secretRef: ""

env:
  CONSOLE_API_ADDR: ":8090"
  GATEWAY_URL: http://gateway:8080
  PUBLIC_BASE_URL: http://localhost:3000
  CONSOLE_DEV_LOG_RAW_TOKENS: "false"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_SSLMODE: disable
  OPA_URL: http://opa:8181
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_PASS: ""
  SMTP_FROM: ""
  # Required — must be ≥32 bytes. Provide via secretRef or set explicitly.
  CONSOLE_JWT_SECRET: ""
  CONSOLE_CORS_ORIGINS: ""

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: console-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
