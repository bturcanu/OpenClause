fullnameOverride: "console-ui"

image:
  repository: oc/console-ui
  tag: "latest"
  pullPolicy: IfNotPresent

replicas: 1

service:
  port: 80

secretRef: ""

env: {}

probes:
  liveness:
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: console.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
