[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclause"
version = "0.1.0"
description = "Python SDK for the OpenClause agentic access governance gateway"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "OpenClause Contributors"},
]
keywords = ["openclause", "governance", "agentic", "access-control", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/openclause/openclause"
Documentation = "https://docs.openclause.dev"
Repository = "https://github.com/openclause/openclause"

[tool.setuptools.packages.find]
include = ["openclause*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
