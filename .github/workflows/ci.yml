name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  GO_VERSION: "1.25"
  IMAGE_BASE: ghcr.io/bturcanu/openclause
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -count=1

      - name: Run vet
        run: go vet ./...

  go-race:
    name: Go Race
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Run race tests
        run: go test -race ./... -count=1

  go-fuzz-smoke:
    name: Go Fuzz Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Run analytics parser fuzz smoke
        run: |
          go test ./cmd/console-api -run '^$' -fuzz=FuzzParseRangeDurationDoesNotReturnNonPositiveValues -fuzztime=2s
          go test ./cmd/console-api -run '^$' -fuzz=FuzzParseBucketMinutesStaysWithinSupportedBounds -fuzztime=2s
          go test ./cmd/console-api -run '^$' -fuzz=FuzzParseTopAgentsStaysWithinSupportedBounds -fuzztime=2s

      - name: Run auth and timestamp fuzz smoke
        run: |
          go test ./cmd/console-api -run '^$' -fuzz=FuzzBearerTokenOnlyReturnsTrimmedSecondField -fuzztime=2s
          go test ./cmd/console-api -run '^$' -fuzz=FuzzParseOptionalTimestampNeverReturnsZeroTime -fuzztime=2s
          go test ./cmd/console-api -run '^$' -fuzz=FuzzParseSinceReturnsFiniteTime -fuzztime=2s
          go test ./pkg/auth -run '^$' -fuzz=FuzzBearerAPIKeyOnlyReturnsTrimmedSecondField -fuzztime=2s

  console-ui:
    name: Console UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/console/package-lock.json

      - name: Install console dependencies
        run: npm ci --prefix web/console

      - name: Run console tests
        run: npm --prefix web/console run test

      - name: Build console
        run: npm --prefix web/console run build

  python-sdk-39:
    name: Python SDK 3.9
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Python SDK
        run: python -m pip install -e sdk/python

      - name: Verify core imports
        run: python -c "import openclause; import openclause.client; import openclause.models"

  python-sdk-tests:
    name: Python SDK Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python SDK
        run: python -m pip install -e sdk/python

      - name: Run Python SDK tests
        run: PYTHONPATH=sdk/python python -m unittest discover -s sdk/python/tests -v

  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install TypeScript SDK dependencies
        run: npm ci --prefix sdk/typescript

      - name: Build TypeScript SDK
        run: npm --prefix sdk/typescript run build

      - name: Run TypeScript SDK tests
        run: npm --prefix sdk/typescript run test

  java-sdk:
    name: Java SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run Java SDK tests
        run: ./gradlew test
        working-directory: sdk/java

  policy-test:
    name: Policy Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -L -o opa https://github.com/open-policy-agent/opa/releases/download/v0.62.0/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/

      - name: Run OPA tests
        run: opa test policy/bundles/v0 policy/tests -v

  browser-smoke:
    name: Browser Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/console/package-lock.json

      - name: Install console dependencies
        run: npm ci --prefix web/console

      - name: Install Playwright browser
        run: npx --prefix web/console playwright install --with-deps chromium

      - name: Start stack
        run: ./scripts/dev.sh

      - name: Seed smoke data
        run: ./scripts/demo.sh

      - name: Run browser smoke tests
        run: npm --prefix web/console run test:e2e

      - name: Upload browser smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-artifacts
          path: |
            web/console/playwright-report
            web/console/test-results
          if-no-files-found: ignore

  e2e-curl-happy-path:
    name: E2E Curl Happy Path
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run curl-based end-to-end smoke
        run: bash ./scripts/e2e-curl-happy-path.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall

  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go-test, go-race, go-fuzz-smoke, console-ui, python-sdk-39, python-sdk-tests, typescript-sdk, java-sdk, policy-test, browser-smoke, e2e-curl-happy-path, lint]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/gateway:latest
            ${{ env.IMAGE_BASE }}/gateway:${{ github.sha }}
          build-args: |
            SERVICE_NAME=gateway

      - name: Build and push approvals
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/approvals:latest
            ${{ env.IMAGE_BASE }}/approvals:${{ github.sha }}
          build-args: |
            SERVICE_NAME=approvals

      - name: Build and push connector-slack
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/connector-slack:latest
            ${{ env.IMAGE_BASE }}/connector-slack:${{ github.sha }}
          build-args: |
            SERVICE_NAME=connector-slack

      - name: Build and push connector-jira
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/connector-jira:latest
            ${{ env.IMAGE_BASE }}/connector-jira:${{ github.sha }}
          build-args: |
            SERVICE_NAME=connector-jira

      - name: Build and push console-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/console-api:latest
            ${{ env.IMAGE_BASE }}/console-api:${{ github.sha }}
          build-args: |
            SERVICE_NAME=console-api

      - name: Build and push console-ui
        uses: docker/build-push-action@v6
        with:
          context: ./web/console
          file: ./web/console/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/console-ui:latest
            ${{ env.IMAGE_BASE }}/console-ui:${{ github.sha }}

      - name: Build and push alert-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/alert-worker:latest
            ${{ env.IMAGE_BASE }}/alert-worker:${{ github.sha }}
          build-args: |
            SERVICE_NAME=alert-worker

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    # Uncomment and configure when ready: environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to cluster (placeholder)
        run: |
          echo "Deploy step - configure kubectl/helm to deploy to EKS cluster"
          echo "Example: helm upgrade --install gateway deploy/helm/gateway -f deploy/helm/gateway/values.yaml"
